
name: E2E

on:
  push:    
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
        E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
        E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        BASE_URL: https://staging-2026-02-26.mex16.dev/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Run feature tests for work orders and assets
      #- name: Run feature tests (WO + Asset + Requests + Supplier)
      #  run: npm run test:features

      # Run only tests tagged @smoke
      - name: Run smoke tests (@smoke)
        id: smoke
        continue-on-error: true
        run: npm run test:smoke

      # Run only tests tagged @regression  
      - name: Run regression tests (@regression)
        id: regression
        continue-on-error: true
        run: npm run test:regression
        
      # Upload Smoke HTML report
      - name: Upload smoke HTML report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: smoke-test-report             
          path: playwright-report-smoke
          if-no-files-found: ignore

      # Upload Smoke test results
      - name: Upload Smoke test results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: smoke-test-results
          path: smoke-test-results
          if-no-files-found: ignore

      # Upload Regression HTML report
      - name: Upload regression HTML report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: regression-test-report             
          path: playwright-report-regression
          if-no-files-found: ignore          

      # Upload Regression test results
      - name: Upload Regression test results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: regression-test-results
          path: regression-test-results
          if-no-files-found: ignore
      
      # Fail workflow if any test suite failed
      - name: Fail workflow if any test suite failed
        if: steps.smoke.outcome == 'failure' || steps.regression.outcome == 'failure'
        run: exit 1